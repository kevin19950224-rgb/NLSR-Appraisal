function parseCSV(text){
  return text.trim().split("\n").map(row=>{
    const cells=[];let cur="";let inQ=false;
    for(let i=0;i<row.length;i++){
      const ch=row[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===","&&!inQ){cells.push(cur.trim());cur="";}
      else{cur+=ch;}
    }
    cells.push(cur.trim());
    return cells;
  });
}

function extractTable(rows,startCol,keys){
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const obj={};let hasData=false;
    keys.forEach((k,i)=>{const v=(row[startCol+i]||"").trim();obj[k]=v;if(v)hasData=true;});
    if(hasData)out.push(obj);
  }
  return out;
}

function SignaturePad({label, subLabel, stampName, stampRole, onSave, hasError, isBM}){
  const canvasRef = React.useRef(null);
  const [drawing, setDrawing]   = React.useState(false);
  const [hasSig,  setHasSig]    = React.useState(false);
  const [saved,   setSaved]     = React.useState(false);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src  = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
  };

  const startDraw = (e) => {
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
    setDrawing(true); setHasSig(true); setSaved(false);
  };

  const draw = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx    = canvas.getContext("2d");
    const pos    = getPos(e, canvas);
    ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#1a1a2e";
    ctx.lineTo(pos.x, pos.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
  };

  const endDraw = (e) => { if(e) e.preventDefault(); setDrawing(false); };

  const clearSig = () => {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    setHasSig(false); setSaved(false); onSave("");
  };

  const saveSig = () => {
    const canvas = canvasRef.current;
    const stamp  = document.createElement("canvas");
    stamp.width  = canvas.width;
    stamp.height = canvas.height + 38;
    const sctx   = stamp.getContext("2d");
    sctx.fillStyle = "#FFFFFF";
    sctx.fillRect(0, 0, stamp.width, stamp.height);
    sctx.drawImage(canvas, 0, 0);
    sctx.fillStyle = "#E8DDD2";
    sctx.fillRect(0, canvas.height, stamp.width, 1);
    const now = new Date();
    const ts  = now.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})
              + "  " + now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    sctx.fillStyle = "#6B4226"; sctx.font = "bold 11px Arial";
    sctx.fillText(stampName, 10, canvas.height + 15);
    sctx.fillStyle = "#9B8878"; sctx.font = "10px Arial";
    sctx.fillText(stampRole + "   |   " + ts, 10, canvas.height + 30);
    onSave(stamp.toDataURL("image/png"));
    setSaved(true);
  };

  return (
    <div>
      <p style={{fontSize:12,fontWeight:700,color:"#6B4226",margin:"0 0 2px"}}>{label}</p>
      <p style={{fontSize:11,color:"#9B8878",margin:"0 0 8px"}}>{subLabel}</p>
      <div style={{position:"relative",border:"2px solid "+(hasError?"#F87171":saved?"#4ADE80":"#E8DDD2"),borderRadius:12,overflow:"hidden",background:"#FAFAFA",touchAction:"none"}}>
        <canvas ref={canvasRef} width={600} height={160}
          style={{display:"block",width:"100%",height:120,cursor:"crosshair",touchAction:"none"}}
          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}/>
        {!hasSig&&(
          <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",pointerEvents:"none",textAlign:"center"}}>
            <p style={{fontSize:24,margin:"0 0 4px"}}>✍️</p>
            <p style={{fontSize:11,color:"#C4B5A5",margin:0}}>{isBM?"Tandatangan di sini dengan jari anda":"Sign here using your finger"}</p>
          </div>
        )}
        {saved&&(
          <div style={{position:"absolute",top:6,right:8,background:"#DCFCE7",borderRadius:99,padding:"3px 10px",fontSize:10,fontWeight:700,color:"#15803D"}}>
            ✓ {isBM?"Tersimpan":"Saved"}
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={clearSig} style={{flex:1,padding:"9px 0",borderRadius:10,border:"1.5px solid #E8DDD2",background:"#fff",color:"#9B8878",fontSize:12,fontWeight:600,cursor:"pointer"}}>
          🗑 {isBM?"Padam":"Clear"}
        </button>
        <button onClick={saveSig} disabled={!hasSig||saved}
          style={{flex:2,padding:"9px 0",borderRadius:10,border:"none",
            background:hasSig&&!saved?"linear-gradient(135deg,#8B1A1A,#C0392B)":"#e5e7eb",
            color:hasSig&&!saved?"#fff":"#9ca3af",fontSize:12,fontWeight:700,
            cursor:hasSig&&!saved?"pointer":"not-allowed"}}>
          {saved?(isBM?"✓ Tandatangan Disimpan":"✓ Signature Saved"):(isBM?"Simpan Tandatangan":"Save Signature")}
        </button>
      </div>
      {hasError&&<p style={{fontSize:11,color:"#DC2626",marginTop:5}}>⚠️ {isBM?"Sila tandatangan dan simpan":"Please sign and save before submitting"}</p>}
    </div>
  );
}

        <Lbl t={`📅 ${bm?"Tempoh Penilaian":"Review Period"}`}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
          {["Probation","Quarterly","Annual"].map(t=><button key={t} onClick={()=>setProf({...prof,type:t})}
            style={{padding:"10px 4px",borderRadius:12,border:`2px solid ${prof.type===t?B.red:B.border}`,background:prof.type===t?"#FFF5F5":B.cream,color:prof.type===t?B.red:B.muted,fontWeight:600,fontSize:12,cursor:"pointer"}}>
            {t==="Probation"?(bm?"Percubaan":"Probation"):t==="Quarterly"?(bm?"Suku Tahun":"Quarterly"):(bm?"Tahunan":"Annual")}
          </button>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[["from",bm?"Dari":"From"],["to",bm?"Hingga":"To"]].map(([k,l])=><div key={k}>
            <label style={{fontSize:12,fontWeight:500,color:B.muted,display:"block",marginBottom:4}}>{l}<span style={{color:B.red,marginLeft:3}}>*</span></label>
            <input type="date" style={{width:"100%",borderRadius:12,padding:"11px 12px",border:`1.5px solid ${B.border}`,background:B.cream,color:B.brown,fontSize:13,outline:"none"}} value={prof[k]} onChange={e=>setProf({...prof,[k]:e.target.value})}/>
          </div>)}
        </div>
      </div>}/>
      <Card ch={<div style={{padding:20}}>
        <Lbl t={`🏅 ${bm?"Gred Jawatan":"Job Grade"}`}/>
        {Object.entries(kpi).map(([k,v])=><button key={k} onClick={()=>setProf({...prof,grade:k})}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",borderRadius:12,border:`2px solid ${prof.grade===k?B.red:B.border}`,background:prof.grade===k?"#FFF5F5":B.cream,color:prof.grade===k?B.red:B.brown,fontWeight:500,fontSize:14,cursor:"pointer",marginBottom:8}}>
          <span><b>{k}</b> — {v.label}</span>
          {prof.grade===k&&<span style={{color:B.red,fontWeight:700}}>✓</span>}
        </button>)}
      </div>}/>
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:`1px solid ${B.border}`,padding:"12px 20px"}}>
      {formTouched&&(!prof.name||!prof.outlet||!prof.appraiser||!prof.from||!prof.to)&&(
        <div style={{background:"#FFF5F5",border:`1px solid #FECACA`,borderRadius:12,padding:"10px 14px",marginBottom:10}}>
          <p style={{fontSize:12,color:B.red,margin:0,fontWeight:600}}>⚠️ {bm?"Sila lengkapkan semua medan bertanda *":"Please complete all fields marked with *"}</p>
          <p style={{fontSize:11,color:B.muted,margin:"3px 0 0"}}>{bm?"Nama pekerja, cawangan, nama penilai, dan tarikh penilaian diperlukan.":"Employee name, outlet, appraiser name, and review dates are required."}</p>
        </div>
      )}
      <Btn disabled={false} onClick={()=>{setFormTouched(true);if(!prof.name||!prof.outlet||!prof.appraiser||!prof.from||!prof.to)return;setStep(0);setScr("quiz");}} ch={bm?"Mulakan Soalan →":"Start Questions →"}/>
    </div>
  </div>}/>;

  // ── QUIZ ──
  if(scr==="quiz"){
    const pct=((step+1)/tot)*100;
    const sec=g.sections.find(s=>s.criteria.find(c=>c.id===cr.id));
    const last=step===tot-1;
    return <Shell ch={<div>
      <div style={{background:"#fff",borderBottom:`1px solid ${B.border}`,padding:"16px 20px 12px",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8}}>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontSize:11,color:B.muted,margin:"0 0 2px"}}>{bm?"Langkah":"Step"} {step+1} {bm?"daripada":"of"} {tot} — <span style={{color:B.red}}>{sec?.title}</span></p>
            <p style={{fontSize:14,fontWeight:700,color:B.brown,margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{bm?cr.bm:cr.en}</p>
          </div>
          <div style={{display:"flex",gap:6,marginLeft:10,flexShrink:0}}>
            <button onClick={()=>snap()} style={{fontSize:11,fontWeight:700,padding:"6px 10px",borderRadius:99,background:"#FFF5F5",color:B.red,border:`1px solid #FECACA`,cursor:"pointer"}}>💾 {bm?"Simpan":"Save"}</button>
            <button onClick={()=>setL(bm?"EN":"BM")} style={{fontSize:11,fontWeight:700,padding:"6px 10px",borderRadius:99,background:B.kraft,color:B.brown,border:`1px solid ${B.border}`,cursor:"pointer"}}>{bm?"EN":"BM"}</button>
          </div>
        </div>
        <div style={{height:6,borderRadius:99,background:B.kraft,overflow:"hidden"}}>
          <div style={{height:"100%",borderRadius:99,width:`${pct}%`,background:`linear-gradient(90deg,${B.red},${B.crimson})`,transition:"width 0.4s"}}/>
        </div>
      </div>
      <div style={{padding:"20px 20px 100px",display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:`linear-gradient(135deg,${B.red},#5C0F0F)`,borderRadius:18,padding:20,position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:0,right:0,width:80,height:80,borderRadius:"50%",background:"rgba(255,255,255,0.08)",transform:"translate(30%,-30%)"}}/>
          <p style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"rgba(255,200,200,0.9)",marginBottom:8}}>Appraisal Question</p>
          <h2 style={{fontSize:18,fontWeight:900,color:"#fff",margin:"0 0 8px",lineHeight:1.3}}>
            {bm?`Bagaimana prestasi anda dalam "${cr.bm}" tempoh ini?`:`How would you rate your "${cr.en}" this review period?`}
          </h2>
          <p style={{fontSize:11,color:"rgba(255,200,200,0.8)",margin:0}}>{bm?`Wajaran: ${(cr.w*100).toFixed(0)}%`:`Weight: ${(cr.w*100).toFixed(0)}%`}</p>
        </div>
        {/* Stage 2 banner — shows this question was pre-filled from Stage 1 */}
        {submissionStage===2&&s1Found?.rat?.[cr.id]&&(
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:-6}}>
            <span style={{fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:99,background:"#DCFCE7",color:"#15803D"}}>📥 {bm?"Pra-isi daripada Peringkat 1":"Pre-filled from Stage 1"}</span>
          </div>
        )}
        {RC.map(r=>{
          const sel=rat[cr.id]===r.value;
          const wasS1Answer = submissionStage===2 && s1Found?.rat?.[cr.id]===r.value;
          return <button key={r.value} onClick={()=>{const nr={...rat,[cr.id]:r.value};setRat(nr);snap({rat:nr});}}
            style={{textAlign:"left",borderRadius:16,padding:16,border:`2px solid ${sel?r.selBorder:r.border}`,background:r.bg,boxShadow:sel?`0 0 0 3px ${r.selRing}`:"none",cursor:"pointer",outline:"none",WebkitAppearance:"none"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:22}}>{r.icon}</span>
                <p style={{fontWeight:700,fontSize:14,color:r.text,margin:0}}>{r.value} — {bm?r.bm:r.en}</p>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                {wasS1Answer&&<span style={{fontSize:10,fontWeight:700,padding:"4px 8px",borderRadius:99,background:"#DCFCE7",color:"#15803D"}}>{bm?"Jwpn S1":"S1 Answer"}</span>}
                {sel&&<span style={{fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:99,background:r.bbg,color:r.btxt}}>✓ {bm?"Dipilih":"Selected"}</span>}
              </div>
            </div>
            <p style={{fontSize:12,lineHeight:1.5,color:sel?r.text:B.muted,margin:0}}>{cr.d[bm?"bm":"en"][r.value-1]}</p>
          </button>;
        })}
        <Card ch={<div style={{padding:16}}>
          <p style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",color:B.muted,marginBottom:8}}>💬 {bm?"Komen / Contoh Tambahan":"Additional Comments / Examples"}</p>
          <div style={{position:"relative"}}>
            <textarea style={{width:"100%",minHeight:88,borderRadius:12,padding:"12px 44px 12px 14px",border:`1.5px solid ${B.border}`,background:B.cream,color:B.brown,fontSize:13,outline:"none",lineHeight:1.5}}
              placeholder={bm?"Kongsi contoh atau pemerhatian spesifik...":"Share a specific example or observation..."}
              value={cmt[cr.id]||""} onChange={e=>setCmt({...cmt,[cr.id]:e.target.value})}/>
            <button style={{position:"absolute",bottom:10,right:10,width:32,height:32,borderRadius:"50%",background:"#FFF5F5",border:"none",color:B.red,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🎤</button>
          </div>
          <p style={{fontSize:11,color:B.muted,marginTop:4}}>{bm?"Ketik ikon mikrofon untuk Suara-ke-Teks":"Tap mic icon for Voice-to-Text"}</p>
        </div>}/>
      </div>
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:`1px solid ${B.border}`,padding:"12px 20px",display:"flex",gap:10}}>
        <Btn ghost onClick={()=>{if(step>0)setStep(step-1);else setScr("setup");}} ch={`← ${bm?"Sebelum":"Prev"}`}/>
        <Btn disabled={!rat[cr.id]} onClick={()=>{if(!rat[cr.id])return;snap();if(last)setScr("summary");else setStep(step+1);}} ch={last?(bm?"Semak Ringkasan 🎉":"View Summary 🎉"):`${bm?"Seterusnya":"Next"} →`}/>
      </div>
    </div>}/>;
  }

  // ── SUMMARY ──
  const sA=g.sections.filter(s=>!s.isOp);
  const sB=g.sections.filter(s=>s.isOp);

  return <Shell ch={<div>
    <div style={{background:"#fff",borderBottom:`1px solid ${B.border}`,padding:"20px 20px 14px",position:"sticky",top:0,zIndex:20,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div>
        <p style={{fontSize:11,color:B.muted,margin:0}}>{bm?"Ringkasan Penilaian":"Appraisal Summary"}</p>
        <h1 style={{fontSize:15,fontWeight:700,color:B.brown,margin:0}}>{prof.name||"Team Member"}</h1>
      </div>
      <button onClick={()=>setL(bm?"EN":"BM")} style={{fontSize:11,fontWeight:700,background:B.kraft,color:B.brown,border:`1px solid ${B.border}`,borderRadius:99,padding:"6px 12px",cursor:"pointer"}}>{bm?"EN":"BM"}</button>
    </div>
    <p style={{fontSize:12,fontWeight:500,color:B.red,padding:"8px 20px 0"}}>{bm?"Tahniah atas usaha anda! 🌟":"Well done on completing your review! 🌟"}</p>

    <div style={{padding:"12px 20px 120px",display:"flex",flexDirection:"column",gap:14}}>
      {/* Profile */}
      <div style={{background:`linear-gradient(135deg,${B.red},#5C0F0F)`,borderRadius:18,padding:20,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,right:0,width:120,height:120,borderRadius:"50%",background:"rgba(255,255,255,0.07)",transform:"translate(30%,-30%)"}}/>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <div style={{width:48,height:48,borderRadius:14,background:"rgba(255,255,255,0.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,color:"#fff",flexShrink:0}}>{(prof.name||"?")[0].toUpperCase()}</div>
          <div><p style={{fontWeight:900,fontSize:16,color:"#fff",margin:0}}>{prof.name||"—"}</p><p style={{fontSize:12,color:"rgba(255,220,220,0.85)",margin:0}}>{prof.grade} · {g.label}</p></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[[bm?"Cawangan":"Outlet",prof.outlet||"—"],[bm?"Penilai":"Appraiser",prof.appraiser||"—"],[bm?"Jenis":"Type",prof.type],[bm?"Tempoh":"Period",`${fmt(prof.from)} – ${fmt(prof.to)}`]].map(([l,v])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:10}}>
              <p style={{fontSize:10,color:"rgba(255,210,210,0.8)",margin:"0 0 2px"}}>{l}</p>
              <p style={{fontSize:12,fontWeight:600,color:"#fff",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v}</p>
            </div>
          ))}
        </div>
      </div>

      {/* Section A */}
      {sA.map(sec=><div key={sec.title}>
        <p style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:B.red,margin:"4px 0 8px"}}>{sec.title}</p>
        {sec.criteria.map(c=>{
          const r=rat[c.id];const rc=r?RC[r-1]:null;
          return <Card key={c.id} ch={<div style={{padding:16}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:rc?10:0}}>
              <div style={{flex:1}}>
                <p style={{fontSize:14,fontWeight:700,color:B.brown,margin:"0 0 2px"}}>{bm?c.bm:c.en}</p>
                <p style={{fontSize:11,color:B.muted,margin:0}}>{bm?`Wajaran: ${(c.w*100).toFixed(0)}%`:`Weight: ${(c.w*100).toFixed(0)}%`}</p>
              </div>
              {rc?<span style={{fontSize:11,fontWeight:700,padding:"6px 12px",borderRadius:99,background:rc.bbg,color:rc.btxt,flexShrink:0,whiteSpace:"nowrap"}}>{rc.icon} {bm?rc.bm:rc.en}</span>
                :<span style={{fontSize:11,padding:"6px 12px",borderRadius:99,background:B.kraft,color:B.muted,flexShrink:0}}>{bm?"Tidak dinilai":"Not rated"}</span>}
            </div>
            {rc&&<div style={{background:rc.bg,border:`1.5px solid ${rc.border}`,borderRadius:12,padding:"10px 12px",marginBottom:cmt[c.id]?10:0}}>
              <p style={{fontSize:12,lineHeight:1.5,color:rc.text,margin:0}}><b>{rc.icon} {bm?rc.bm:rc.en}:</b> {c.d[bm?"bm":"en"][(r||1)-1]}</p>
            </div>}
            {cmt[c.id]&&<div style={{background:B.kraft,border:`1.5px solid ${B.border}`,borderRadius:12,padding:"10px 12px"}}>
              <p style={{fontSize:11,fontWeight:600,color:B.muted,margin:"0 0 3px"}}>💬 {bm?"Komen":"Remarks"}</p>
              <p style={{fontSize:12,lineHeight:1.5,color:B.brown,margin:0}}>{cmt[c.id]}</p>
            </div>}
          </div>} s={{marginBottom:8}}/>;
        })}
      </div>)}

      {/* Section B */}
      {sB.length>0&&<div>
        <p style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:B.red,margin:"4px 0 4px"}}>{sB[0].title}</p>
        <p style={{fontSize:12,color:B.muted,margin:"0 0 8px"}}>{bm?"Keputusan akan dibincangkan bersama HR":"Results to be finalised with HR during discussion"}</p>
        {sB[0].criteria.map(c=>{
          const r=rat[c.id];const rc=r?RC[r-1]:null;
          return <Card key={c.id} ch={<div style={{padding:16}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:rc?10:0}}>
              <div style={{flex:1}}>
                <p style={{fontSize:14,fontWeight:700,color:B.brown,margin:"0 0 2px"}}>{bm?c.bm:c.en}</p>
                <p style={{fontSize:11,color:B.muted,margin:0}}>{bm?`Wajaran: ${(c.w*100).toFixed(0)}%`:`Weight: ${(c.w*100).toFixed(0)}%`}</p>
              </div>
              {rc?<span style={{fontSize:11,fontWeight:700,padding:"6px 12px",borderRadius:99,background:rc.bbg,color:rc.btxt,flexShrink:0,whiteSpace:"nowrap"}}>{rc.icon} {bm?rc.bm:rc.en}</span>
                :<span style={{fontSize:11,padding:"6px 12px",borderRadius:99,background:B.kraft,color:B.muted,flexShrink:0}}>{bm?"Belum dinilai":"Not yet rated"}</span>}
            </div>
            {rc&&<div style={{background:rc.bg,border:`1.5px solid ${rc.border}`,borderRadius:12,padding:"10px 12px",marginBottom:cmt[c.id]?10:0}}>
              <p style={{fontSize:12,lineHeight:1.5,color:rc.text,margin:0}}><b>{rc.icon} {bm?rc.bm:rc.en}:</b> {c.d[bm?"bm":"en"][(r||1)-1]}</p>
            </div>}
            {cmt[c.id]&&<div style={{background:B.kraft,border:`1.5px solid ${B.border}`,borderRadius:12,padding:"10px 12px"}}>
              <p style={{fontSize:11,fontWeight:600,color:B.muted,margin:"0 0 3px"}}>💬 {bm?"Komen":"Remarks"}</p>
              <p style={{fontSize:12,lineHeight:1.5,color:B.brown,margin:0}}>{cmt[c.id]}</p>
            </div>}
          </div>} s={{marginBottom:8}}/>;
        })}
        <div style={{background:"#FFF5F5",borderRadius:12,padding:"10px 16px",textAlign:"center",marginTop:4}}>
          <p style={{fontSize:12,fontWeight:500,color:B.red,margin:0}}>🔒 {bm?"Skor keseluruhan akan ditentukan oleh HR selepas perbincangan":"Overall score to be determined by HR after discussion"}</p>
        </div>
      </div>}

      {/* Feedback */}
      <Card ch={<div style={{padding:20}}>
        <Lbl t={`📝 ${bm?"Maklum Balas":"Feedback"}`}/>
        {[[bm?"💪 Kekuatan":"💪 Strengths",str,setStr],[bm?"🌱 Kawasan Penambahbaikan":"🌱 Areas for Growth",agr,setAgr]].map(([l,v,sv])=>(
          <div key={l} style={{marginBottom:12}}>
            <label style={{fontSize:12,fontWeight:600,color:B.brown,display:"block",marginBottom:6}}>{l}</label>
            <textarea style={{width:"100%",minHeight:70,borderRadius:12,padding:"12px 14px",border:`1.5px solid ${B.border}`,background:B.cream,color:B.brown,fontSize:13,outline:"none",lineHeight:1.5}} placeholder={bm?"Tulis di sini...":"Write here..."} value={v} onChange={e=>sv(e.target.value)}/>
          </div>
        ))}
      </div>}/>

      {/* Action Plan */}
      <div style={{background:"linear-gradient(135deg,#FFF5F5,#FEE2E2)",border:`1.5px solid #FECACA`,borderRadius:18,padding:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}><span style={{fontSize:20}}>🎯</span><p style={{fontSize:14,fontWeight:700,color:B.red,margin:0}}>{bm?"Matlamat untuk Penilaian Seterusnya":"Goal for Next Review"}</p></div>
        <textarea style={{width:"100%",minHeight:80,borderRadius:12,padding:"12px 14px",border:`1.5px solid #FECACA`,background:"rgba(255,255,255,0.8)",color:B.brown,fontSize:13,outline:"none",lineHeight:1.5}}
          placeholder={bm?"Apakah satu perkara yang akan anda fokuskan?":"What's the one thing you'll both commit to before the next review?"}
          value={ap} onChange={e=>setAp(e.target.value)}/>
      </div>

      {/* Sign Off — Stage aware */}
      {!done?<Card ch={<div style={{padding:20}}>

        {/* Stage toggle */}
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[1,2].map(s=>(
            <button key={s} onClick={()=>{setSubmissionStage(s);setEmpSigData("");setAprSigData("");setEmpSigErr(false);setAprSigErr(false);}}
              style={{flex:1,padding:"9px 0",borderRadius:10,border:`2px solid ${submissionStage===s?B.red:B.border}`,
                background:submissionStage===s?"#FFF5F5":"#fff",
                color:submissionStage===s?B.red:B.muted,fontSize:12,fontWeight:700,cursor:"pointer"}}>
              {s===1?(bm?"Peringkat 1 — Penilaian Diri":"Stage 1 — Self Assessment"):(bm?"Peringkat 2 — Penilaian Akhir":"Stage 2 — Final Sign-Off")}
            </button>
          ))}
        </div>

        {/* Stage description */}
        {submissionStage===1?(
          <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"10px 14px",marginBottom:14}}>
            <p style={{fontSize:12,fontWeight:700,color:"#92400E",margin:"0 0 3px"}}>📋 {bm?"Peringkat 1 — Hantar kepada Penilai":"Stage 1 — Submit to Appraiser"}</p>
            <p style={{fontSize:11,color:"#B45309",margin:0,lineHeight:1.5}}>{bm?"Tandatangan pekerja diperlukan sahaja. Rekod ini akan dihantar kepada penilai untuk semakan sebelum perbincangan 1-on-1.":"Employee signature only required. This record will be sent to the appraiser for review before your 1-on-1 discussion."}</p>
          </div>
        ):(
          <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"10px 14px",marginBottom:14}}>
            <p style={{fontSize:12,fontWeight:700,color:"#15803D",margin:"0 0 3px"}}>✅ {bm?"Peringkat 2 — Pengesahan Akhir":"Stage 2 — Final Sign-Off"}</p>
            <p style={{fontSize:11,color:"#15803D",margin:0,lineHeight:1.5}}>{bm?"Kedua-dua tandatangan diperlukan untuk menutup penilaian ini secara rasmi. Hantar selepas perbincangan 1-on-1 selesai.":"Both signatures required to officially close this appraisal. Submit after the 1-on-1 discussion is complete."}</p>
          </div>
        )}

        <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"8px 12px",marginBottom:14}}>
          <p style={{fontSize:11,color:"#92400E",margin:0}}>📅 {new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</p>
        </div>

        <div style={{height:1,background:B.border,margin:"4px 0 16px"}}/>

        {/* Employee signature — always required */}
        <SignaturePad
          label={`${submissionStage===1?"":"1. "}${bm?"Tandatangan Pekerja":"Employee Signature"}`}
          subLabel={prof.name + (prof.id ? " · " + prof.id : "") + " · " + (prof.grade||"")}
          stampName={prof.name||"Employee"}
          stampRole={(prof.grade||"") + " · " + (prof.outlet||"")}
          onSave={setEmpSigData}
          hasError={empSigErr}
          isBM={bm}
        />

        {/* Appraiser signature — Stage 2 only */}
        {submissionStage===2&&(<>
          <div style={{height:1,background:B.border,margin:"16px 0"}}/>
          <SignaturePad
            label={`2. ${bm?"Tandatangan Penilai":"Appraiser Signature"}`}
            subLabel={(prof.appraiser||"Appraiser") + " · " + (prof.outlet||"")}
            stampName={prof.appraiser||"Appraiser"}
            stampRole={"Appraiser · " + (prof.outlet||"")}
            onSave={setAprSigData}
            hasError={aprSigErr}
            isBM={bm}
          />
        </>)}

        <div style={{height:1,background:B.border,margin:"16px 0 4px"}}/>
        <div style={{marginTop:12}}><Btn onClick={()=>{
          // Stage-aware validation
          const empOk = empSigData.length > 0;
          const aprOk = submissionStage===1 ? true : aprSigData.length > 0;
          setEmpSigErr(!empOk);
          setAprSigErr(submissionStage===2 ? aprSigData.length===0 : false);
          if(!empOk || !aprOk) return;
          // ── Build submission payload ────────────────────────────────────────
          const now = new Date();
          const ts  = now.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});

          // Score calculation: (weight/100) * (rating/3) * 5
          const kpiRows = all.map(c=>{
            const rating   = rat[c.id]||0;
            const weighted = rating>0 ? (c.w)*(rating/3)*5 : 0;
            const secObj   = g.sections.find(s=>s.criteria.find(x=>x.id===c.id));
            const descriptorEN = rating>0 ? (c.d?.en?.[rating-1]||"") : "";
            const descriptorBM = rating>0 ? (c.d?.bm?.[rating-1]||"") : "";
            return {
              section:    secObj?.title||"",
              kpi:        c.en,
              kpiBM:      c.bm,
              weightPct:  Math.round(c.w*100),
              rating:     rating,
              maxRating:  3,
              weightedScore: parseFloat(weighted.toFixed(4)),
              remarks:    cmt[c.id]||"",
              descriptor:   descriptorEN,
              descriptorBM: descriptorBM
            };
          });

          const totalScore = parseFloat(kpiRows.reduce((s,r)=>s+r.weightedScore,0).toFixed(3));
          const getBand = s => {
            if(s>=4.5)  return "⭐ Outstanding";
            if(s>=4.0)  return "💪 Solid +";
            if(s>=3.25) return "🌳 Solid -";
            if(s>=2.0)  return "🌿 Developmental";
            return "🌱 Unsatisfactory";
          };

          // Find email routing from settings
          const route1 = settings.emailRouting?settings.emailRouting.find(r=>r.stage&&r.stage.includes("1")):null;
          const toEmail  = route1?.toEmail  || "";
          const ccEmail  = route1?.ccEmail  || "";

          const payload = {
            submissionStage: submissionStage,
            stageLabel:      submissionStage===1?"Stage 1 - Self Assessment":"Stage 2 - Final Sign-Off",
            timestamp:       ts,
            employeeName:    prof.name,
            employeeId:      prof.id,
            outletCode:      prof.outlet,
            appraiserName:   prof.appraiser,
            jobGrade:        prof.grade,
            gradeLabel:      g.label,
            reviewType:      prof.type,
            reviewFrom:      prof.from,
            reviewTo:        prof.to,
            totalScore:      totalScore,
            performanceBand: getBand(totalScore),
            strengths:       str,
            areasForGrowth:  agr,
            actionPlan:      ap,
            signOffTime:     ts,
            kpiDetail:       kpiRows,
            toEmail:         toEmail,
            ccEmail:         ccEmail,
            replyTo:             "hr@stellarsignature.com",
            employeeSignature:   empSigData,
            appraiserSignature:  aprSigData,
          };

          // ── Fire to Apps Script ─────────────────────────────────────────────
          const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHZGL95pTtJXwGsENx4lZGArMUDv51V19vxqttevuCPG2sCGmAbPaHd0HmceeYiyzlcQ/exec";
          if(SCRIPT_URL.startsWith("https://script.google.com")){
            setSubmitting(true);
            fetch(SCRIPT_URL,{
              method:"POST",
              headers:{"Content-Type":"text/plain"},
              body: JSON.stringify(payload)
            })
            .then(r=>r.json())
            .then(res=>{
              setSubmitting(false);
              if(res.status==="ok"){
                if(submissionStage===1){
                  saveS1Snapshot({prof,rat,cmt,str,agr,ap,savedAt:ts});
                } else {
                  clearS1Snapshot();
                }
                setDone(true); clear(); setPErr(false); setEmpSigErr(false); setAprSigErr(false);
              }
              else { setSubErr("Server error: "+( res.message||"unknown")); }
            })
            .catch(()=>{
              setSubmitting(false);
              setSubErr("Could not reach server. Check your internet connection and try again.");
            });
          } else {
            // Script URL not yet set — still complete locally so testing works
            if(submissionStage===1){
              saveS1Snapshot({prof,rat,cmt,str,agr,ap,savedAt:ts});
            } else {
              clearS1Snapshot();
            }
            setDone(true); clear(); setPErr(false); setEmpSigErr(false); setAprSigErr(false);
          }
        }} ch={submitting?(bm?"Menghantar...":"Submitting ⏳"):(bm?"Hantar ke HR 🚀":"Submit to HR 🚀")}/></div>
        {subErr&&<div style={{marginTop:10,background:"#FEE2E2",border:"1px solid #FECACA",borderRadius:12,padding:"10px 14px"}}>
          <p style={{fontSize:12,color:"#B91C1C",margin:0,fontWeight:600}}>⚠️ Submission Failed</p>
          <p style={{fontSize:11,color:B.muted,margin:"3px 0 0"}}>{subErr}</p>
          <button onClick={()=>setSubErr("")} style={{fontSize:11,color:B.red,background:"none",border:"none",cursor:"pointer",marginTop:4,padding:0}}>Dismiss & try again</button>
        </div>}
      </div>}/>:
      <div style={{background:"linear-gradient(135deg,#FFF5F5,#FEE2E2)",border:`1.5px solid #FECACA`,borderRadius:18,padding:28,textAlign:"center"}}>
        <p style={{fontSize:44,marginBottom:12}}>🎉</p>
        <p style={{fontWeight:900,fontSize:18,color:B.red,marginBottom:4}}>{bm?"Berjaya Dihantar!":"Successfully Submitted!"}</p>
        <p style={{fontSize:12,color:B.muted,lineHeight:1.5}}>{bm?"Penilaian telah dihantar ke HR. Terima kasih kerana mengambil bahagian dengan sepenuh hati.":"This appraisal has been sent to HR. Thank you for engaging thoughtfully."}</p>
        <p style={{fontSize:11,color:B.border,marginTop:12}}>{prof.name} · {prof.grade} · {prof.outlet}</p>
      </div>}
    </div>

    {!done&&<div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:`1px solid ${B.border}`,padding:"12px 20px"}}>
      <Btn ghost onClick={()=>{setStep(tot-1);setScr("quiz");}} ch={`← ${bm?"Kembali Edit Jawapan":"Back to Edit Answers"}`}/>
    </div>}
  </div>}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
